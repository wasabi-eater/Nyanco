<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ブラウザで Nyanco のコードを編集・実行しながら学べる Language Tour">
  <title>Nyanco Language Tour</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#lessons">レッスンへ移動</a>
  <header class="top">
    <a class="brand" href="#top">
      <img src="./icon.svg" width="32" height="32" alt="">
      <span>nyanco</span><small>LANGUAGE TOUR</small>

    <span class="runtime"><i></i> ブラウザで実行</span>

  <div class="layout" id="top">
    <aside>
      <nav aria-label="レッスン一覧">

        <div id="toc"></div>

      <div class="shortcut"><kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>Enter</kbd><p>編集中のコードを実行</p></div>

      <section class="hero">
        <p class="eyebrow"><span class="slash">//</span> INTERACTIVE GUIDE</p>

        <a class="begin" href="#stack">最初のレッスンへ <span aria-hidden="true">↓</span></a>
      </section>
      <div id="lessons"></div>
      <noscript>サンプルの編集と実行には JavaScript が必要です。</noscript>
      <footer><span>NYANCO LANGUAGE TOUR</span><a href="#top">先頭へ戻る ↑</a></footer>

  </div>
